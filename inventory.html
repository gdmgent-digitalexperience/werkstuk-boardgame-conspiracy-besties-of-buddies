<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpelerBOB</title>

      <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" href="./reset.css">

</head>
<body>


    <div class="mobile-only">

    <header>
        <img id="avatar" class="foto" src="./Beelden/BÖB_img van LOGO copy.png" alt="Böb">
        <h1>Speler <span id="playerName"></span></h1>
    </header>

    <div class="btn-row">
        <button class="btn" id="Wittekaart" > Witte kaart </button>
        <button class="btn" id="Zwartekaart" > Zwarte kaart </button>
        <button class="btn" id="Monster" >  Kollëga kaart </button>
    </div>

    <table class="table">
        
        <tr> <th colspan="3"> INVENTORY </th> </tr>

        <tr> 
            <td> <img class="item" src="./Beelden/Hamer_HAMER_HAMER.png" alt="Hämer"></td>
            <td> Hämer</td>
            <td> <span id="hamer_amount">0</span> </td>
        </tr>   
        <tr> 
            <td> <img class="item" src="./Beelden/Schroevendraaier_SCHOEVENDRAAIER_SCHOEVENDRAAIER.png" alt="Schröevendraaier"></td>
            <td> Schröevendraaier</td>
            <td> <span id="schroevendraaier_amount">0</span> </td>
        </tr>   
        <tr> 
            <td> <img class="item" src="./Beelden/Schroef_SCHROEF.png" alt="Schröev"></td>
            <td> Schröev</td>
            <td> <span id="schroef_amount">0</span> </td>
        </tr>   
        <tr> 
            <td> <img class="item" src="./Beelden/Houteding_HOUTEDING_HOUTEDING.png" alt="Houteding"></td>
            <td> Houteding</td>
            <td> <span id="houteding_amount">0</span> </td>
        </tr>    
        <tr> 
            <td> <img class="item" src="./Beelden/Imbus_IMBUS_IMBUS.png" alt="Imbüs"></td>
            <td> Imbüs</td>
            <td> <span id="imbus_amount">0</span> </td>
        </tr>   

    </table>
    
    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <h2 id="popup-title">Items</h2>
            <ul id="popup-items"></ul>
            <button id="popup-button">Toevoegen</button>
        </div>
    </div>

    </div>
    
    <button class="reset-btn" title="Spel resetten">↺</button>
    <script type="module" src="inventory.js"></script>
    <script src="./reset-game.js"></script>
</body>
</html>
